services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ${SANDBOX_NAME:-vibebox}-tailscale
    hostname: ${SANDBOX_NAME:-vibebox}
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false # Runs in high-performance kernel TUN mode (required for TS_DEST_IP routing)
      - TS_DEST_IP=127.0.0.1 # Route incoming Tailnet connections on port 22 to local SSH.
      # Auth key for non-interactive login. Without it the container exits and crash-loops,
      # orphaning the sandbox netns and breaking even local SSH. See .env.example.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale_state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    # TS_DEST_IP=127.0.0.1 installs a DNAT rule to loopback; the kernel drops packets
    # routed to 127.0.0.1 from a non-loopback interface unless route_localnet is enabled.
    # Without this, remote tailnet SSH (ssh user@<sandbox>) silently times out.
    sysctls:
      - net.ipv4.conf.all.route_localnet=1
    ports:
      # Secure local backup: Bind host port 22 to container port 22 on localhost
      # (Note: Will conflict if Windows native OpenSSH Server is active on port 22)
      - "127.0.0.1:${SANDBOX_SSH_PORT:-22}:22"
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Second Tailscale identity dedicated to the Hermes WebUI. One tailscale node =
  # one hostname, so serving the webui as its own tailnet name requires its own
  # node: this sidecar joins the tailnet as <HERMES_HOSTNAME> and `tailscale serve`
  # (declared in hermes-serve/serve.json) terminates TLS on 443 and proxies to the
  # webui, which listens on 8787 inside the vibebox netns — reached here via the
  # compose DNS name "tailscale". Userspace mode: serve is a plain L7 proxy, so no
  # TUN device, NET_ADMIN, or sysctls are needed, and a restart of this container
  # never disturbs the sandbox netns (unlike the tailscale service above).
  hermes-ts:
    image: tailscale/tailscale:latest
    container_name: ${SANDBOX_NAME:-vibebox}-hermes-ts
    hostname: ${HERMES_HOSTNAME:-hermes}
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - hermes_ts_state:/var/lib/tailscale
      # Directory mount (not a single file) so tailscale detects config updates.
      - ./hermes-serve:/config:ro
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Dynamically inject the username, defaulting to 'dev'
        - USERNAME=${SANDBOX_USERNAME:-dev}
        - BASE_IMAGE=${BASE_IMAGE:-ubuntu:24.04}
        - NODE_MAJOR=${NODE_MAJOR:-22}
        - BUN_VERSION=${BUN_VERSION:-latest}
        - CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION:-latest}
        - CODEX_VERSION=${CODEX_VERSION:-latest}
        - CODEBURN_VERSION=${CODEBURN_VERSION:-latest}
        - PI_CODING_AGENT_VERSION=${PI_CODING_AGENT_VERSION:-latest}
        - PYRIGHT_VERSION=${PYRIGHT_VERSION:-latest}
        - TYPESCRIPT_VERSION=${TYPESCRIPT_VERSION:-latest}
        - TYPESCRIPT_LANGUAGE_SERVER_VERSION=${TYPESCRIPT_LANGUAGE_SERVER_VERSION:-latest}
        - VSCODE_LANGSERVERS_VERSION=${VSCODE_LANGSERVERS_VERSION:-latest}
        - YAML_LANGUAGE_SERVER_VERSION=${YAML_LANGUAGE_SERVER_VERSION:-latest}
        - BASH_LANGUAGE_SERVER_VERSION=${BASH_LANGUAGE_SERVER_VERSION:-latest}
        - TAILWIND_LANGUAGE_SERVER_VERSION=${TAILWIND_LANGUAGE_SERVER_VERSION:-latest}
    container_name: ${SANDBOX_NAME:-vibebox}
    image: ${SANDBOX_NAME:-vibebox}:latest
    # No `privileged: true` — it was only ever needed to run a nested daemon, and
    # this stack talks to the host's docker daemon over the bind-mounted socket
    # below instead. Adding it back grants the sandbox host-level capabilities it
    # does not need.
    # SYS_ADMIN is added below instead, scoped to one purpose: Codex CLI's bubblewrap
    # sandbox needs CLONE_NEWUSER to build its user namespace, which Docker's default
    # seccomp profile denies to unprivileged processes. Without it, `bwrap`/`unshare -U`
    # fail with EPERM even once the package is installed.
    cap_add:
      - SYS_ADMIN
    # Share the network namespace of the tailscale container
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    # Everything in .env lands in the container environment, and the entrypoint
    # forwards it to SSH sessions via ~/.ssh/environment — so an API key added to
    # .env is referenceable from shells and agents without touching this file.
    # Deliberately unfiltered: this is a single-user sandbox, and guessing which
    # vars a tool wants is how the previous explicit list silently dropped keys.
    env_file:
      - .env
    environment:
      - SANDBOX_NAME=${SANDBOX_NAME:-vibebox}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      # Consumed by the entrypoint when starting the Hermes WebUI daemon.
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:-}
    volumes:
      # Mount the public SSH keys as read-only from the host into the user's home folder
      - ./authorized_keys:/home/${SANDBOX_USERNAME:-dev}/.ssh/authorized_keys:ro
      # Persist the user's home directory so settings and user files survive rebuilds.
      # Default is the sandbox_home named volume; set SANDBOX_HOME_HOST_PATH in .env
      # (e.g. D:/vibebox) to bind-mount a host folder as home instead, so the same
      # files are visible on the host and in the container. Everything else durable
      # belongs in the Dockerfile; a rebuild is the way to change the rest.
      - "${SANDBOX_HOME_HOST_PATH:-sandbox_home}:/home/${SANDBOX_USERNAME:-dev}"
      # SSH host keys get their own volume rather than living in home: sshd rejects
      # host keys whose permission bits are too open, and those bits are not reliable
      # on host bind mounts. Generated once by the entrypoint; migrated out of
      # ~/.vibebox/ssh automatically on first boot after this split.
      - sandbox_ssh_keys:/opt/vibebox/ssh
      # Mount the host backups folder to /backups inside the container so internal backups write directly to the backups folder
      - ./backups/${SANDBOX_NAME:-vibebox}:/backups
      # Mount the host Docker socket to enable Docker-out-of-Docker CLI access from inside the sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null && test -s /home/${SANDBOX_USERNAME:-dev}/.ssh/authorized_keys"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: ${SANDBOX_MEM_LIMIT:-8g}
    cpus: ${SANDBOX_CPUS:-4}
    pids_limit: ${SANDBOX_PIDS_LIMIT:-1024}
    restart: unless-stopped

volumes:
  # Named volume for persistent user home directory data. Unused when
  # SANDBOX_HOME_HOST_PATH points home at a host folder instead (kept declared so
  # switching back is non-destructive).
  sandbox_home:
    name: ${SANDBOX_NAME:-vibebox}-home
  # Named volume for the SSH host keys (separate from home so home may be a host
  # bind mount — see SANDBOX_HOME_HOST_PATH in .env.example).
  sandbox_ssh_keys:
    name: ${SANDBOX_NAME:-vibebox}-ssh-keys
  # Named volume to persist Tailscale authentication and state between container runs
  tailscale_state:
    name: ${SANDBOX_NAME:-vibebox}-tailscale-state
  # Same, for the hermes-ts sidecar: keeps the <HERMES_HOSTNAME> node identity
  # stable across rebuilds (no hermes-1, hermes-2 hostname sprawl).
  hermes_ts_state:
    name: ${SANDBOX_NAME:-vibebox}-hermes-ts-state
