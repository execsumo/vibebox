# Regenerable content: machine-generated trees that rebuild themselves.
#
# One home-relative path per line. A leading "*/" matches at any depth.
# Blank lines and lines starting with # are ignored.
#
# This is the single source of truth. Both `vibebox backup` (via
# guest/backup-producer, in the guest) and `vibebox migrate` (host-side) read
# this file, so the two can never disagree about what is worth keeping.
#
# The test for belonging here: if the VM were rebuilt, would a normal
# provision or a single install command recreate this? If yes, it is
# regenerable. If it holds anything you typed, it is not.

# Package and build caches
.cache
.npm
.cargo/registry
.cargo/git
go/pkg

# Language toolchains -- reinstalled by rustup/swiftly/provisioning
.rustup
.swift

# Editor server, reinstalled on first remote connect
.vscode-server

# Python virtualenvs -- rebuild with pip install -r
.venvs

# Per-project dependency trees, at any depth
*/node_modules

# Vibebox's own guest state, and the desktop trash
.vibebox
.local/share/Trash
